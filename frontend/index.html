<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Coleccionistas</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <!-- El menú se carga dinámicamente por JS -->
        </nav>
    </header>

    <script type="module" src="src/js/header.js"></script>

    <main class="main-layout">

        <aside class="sidebar">
            <div class="retro-container">
                <h2>Filtros</h2>

                <label for="search">Buscar</label>
                <input type="text" id="search" class="retro-input" placeholder="Buscar por nombre...">

                <label for="category">Categoría</label>
                <select id="category" class="retro-input">
                    <option value="">Todas</option>
                </select>

                <label for="sort">Ordenar por</label>
                <select id="sort" class="retro-input">
                    <option value="newest">Novedades</option>
                    <option value="oldest">Más antiguos</option>
                    <option value="price_asc">Precio: menor a mayor</option>
                    <option value="price_desc">Precio: mayor a menor</option>
                </select>

                <button id="btn-filter" class="retro-button" style="margin-top: 1rem; width: 100%">
                    Aplicar Filtros
                </button>

                <button id="btn-clear" class="retro-button" style="margin-top: 0.5rem; width: 100%">
                    Limpiar
                </button>
            </div>
        </aside>

        <section class="catalogue">
            <div id="products-grid" class="products-grid">
                <p id="loading">Cargando productos...</p>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <script type="module" src="src/js/pages/index.js"></script>
</body>
</html>
