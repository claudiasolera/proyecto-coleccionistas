<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRAR - El Bazar</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
            <!-- Menú dinámico -->
        </nav>
    </header>

    <script type="module" src="src/js/header.js"></script>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="retro-container" style="max-width: 400px; width: 100%;">
            <div class="retro-titlebar">
                <span>LOGIN_SESSION.EXE</span>
                <div class="retro-titlebar-buttons">
                    <button class="win-button" style="padding-bottom:4px;">_</button>
                    <button class="win-button">口</button>
                    <button class="win-button" style="font-weight:bold;">X</button>
                </div>
            </div>
            
            <form id="login-form">
                <label>E-mail:</label>
                <input type="email" id="email" class="retro-input" required placeholder="ejemplo@correo.com">
                
                <label style="margin-top: 1rem;">Contraseña:</label>
                <input type="password" id="password" class="retro-input" required placeholder="********">
                
                <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.75rem;">
                    <input type="checkbox" id="remember" name="remember" 
                        style="width:16px; height:16px; border:2px solid #000; accent-color:var(--clr-primary); cursor:pointer;">
                    <label for="remember" style="font-family:var(--font-accent); font-size:0.85rem; cursor:pointer; text-transform:uppercase;">
                        Recordarme
                    </label>
                </div>

                <p style="text-align:right; margin-top:0.5rem;">
                    <a href="forgot-password.html" style="font-family:var(--font-accent); font-size:0.8rem; color:var(--clr-primary);">
                        ¿Olvidaste tu contraseña?
                    </a>
                </p>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="retro-button" style="flex: 1;">
                        ENTRAR
                    </button>
                    <button type="button" class="retro-button" onclick="location.href='register.html'" style="flex: 1;">
                        SOY NUEVO
                    </button>
                </div>

            </form>
            
            <p id="error-msg" style="color: red; font-size: 0.8rem; margin-top: 1rem; display: none; text-align: center;">Credenciales incorrectas.</p>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <script type="module">
        import { apiFetch } from './src/js/utils.js';

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        const verified = new URLSearchParams(window.location.search).get('verified')
        if (verified) {
            const msg = document.getElementById('error-msg')
            msg.style.color = 'var(--clr-success)'
            msg.style.display = 'block'
            msg.innerText = '[OK] Email verificado. Ya puedes entrar.'
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const remember = document.getElementById('remember').checked

            try {
                const user = await apiFetch('/users/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                })

                const storage = remember ? localStorage : sessionStorage
                storage.setItem('userId', user.id)
                storage.setItem('userName', user.name)
                storage.setItem('userRole', user.role)

                window.location.href = redirect || 'index.html'
            } catch (err) {
                errorMsg.style.display = 'block'
                errorMsg.innerText = err.message
            }
        })
    </script>
</body>
</html>
