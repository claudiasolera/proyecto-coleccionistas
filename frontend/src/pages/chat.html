<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Vendedor - El Bazar</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        #chat-container { max-width: 600px; margin: 2rem auto; height: 70vh; display: flex; flex-direction: column; }
        #chat-window { flex: 1; background: #fff; border: 2px inset #808080; padding: 1rem; overflow-y: auto; margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; }
        .product-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-body { background: #c0c0c0; border: 3px outset #fff; padding: 1rem; width: 400px; max-height: 80vh; overflow-y: auto; }
        .product-select-item { background: #fff; border: 1px solid #000; padding: 10px; margin-bottom: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .product-select-item:hover { background: #000080; color: #fff; }
    </style>
</head>
<body style="background: #808080;">

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
            <!-- Menú dinámico inyectado por header.js -->
        </nav>
    </header>

    <script type="module" src="../js/header.js"></script>

    <main id="chat-container">
        <div class="retro-container" style="flex: 1; display: flex; flex-direction: column;">
            <div id="chat-window">
                <!-- Mensajes -->
            </div>
            
            <form id="chat-form" style="display: flex; gap: 5px; padding: 10px; background: #d0d0d0; border-top: 2px solid #808080;">
                <button type="button" id="btn-attach" class="retro-button" title="Adjuntar Tesoro" style="background: #ffffcc;">➕</button>
                <input type="text" id="chat-input" class="retro-input" style="flex: 1;" placeholder="Escribe al vendedor..." required>
                <button type="submit" class="retro-button">ENVIAR</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <!-- MODAL DE SELECCIÓN DE PRODUCTO -->
    <div id="product-modal" class="product-modal">
        <div class="modal-body">
            <div style="background: #000080; color: #fff; padding: 5px; margin: -1rem -1rem 1rem -1rem; font-weight: bold; display: flex; justify-content: space-between;">
                <span>SELECCIONAR TESORO</span>
                <span id="close-modal" style="cursor: pointer;">[X]</span>
            </div>
            <div id="product-list-attach">
                <!-- Se carga por JS -->
            </div>
        </div>
    </div>

    <script type="module" src="../js/chat.js"></script>
</body>
</html>
