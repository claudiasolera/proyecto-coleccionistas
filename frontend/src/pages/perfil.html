<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Coleccionistas</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>

<body>
    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <!-- Menú dinámico -->
        </nav>
    </header>

    <script type="module" src="../js/header.js"></script>

    <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="border-bottom: 3px solid var(--clr-primary); display: inline-block;"> PANEL DE CONTROL</h1>
            <p style="font-family: var(--font-accent); font-size: 0.9rem;">Bienvenido de nuevo, Coleccionista.</p>
        </div>

        <div>
            <!-- INFORMACIÓN PERSONAL -->
            <section class="retro-container">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 2px solid #000;">DATOS PERSONALES</h2>
                <form id="profile-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <label>Nombre:</label>
                        <input type="text" name="name" class="retro-input" required>
                        <label>Apellidos:</label>
                        <input type="text" name="last_name" class="retro-input" required>
                    </div>

                    <label style="margin-top: 1rem;">Mi Dirección de Envío:</label>
                    <input type="text" name="address" class="retro-input" required>

                    <label style="margin-top: 1rem;">Teléfono de Contacto:</label>
                    <input type="tel" name="phone" class="retro-input" required>

                    <div
                        style="background: #ffffcc; padding: 10px; border: 1px dashed #000; margin-top: 1.5rem; font-size: 0.8rem;">
                        <p><strong>Nota:</strong> Para cambiar tu E-mail o DNI contacta con el Admin.</p>
                    </div>

                    <button type="submit" class="retro-button"
                        style="width: 100%; margin-top: 1.5rem; background: #90ee90;">
                        ACTUALIZAR MIS DATOS
                    </button>
                </form>

                <hr style="margin: 2rem 0; border: 1px dashed #ccc;">

                <button id="btn-logout" class="retro-button" style="width: 100%; border: 2px solid red; color: red;">
                    CERRAR SESIÓN (LOGOUT)
                </button>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía
            RT-Modem</p>
    </footer>

    <script type="module" src="../js/perfil.js"></script>
</body>

</html>
