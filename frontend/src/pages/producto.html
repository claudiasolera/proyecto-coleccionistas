<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Tienda de Coleccionistas</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
            <!-- Menú dinámico inyectado por header.js -->
        </nav>
    </header>

    <script type="module" src="../js/header.js"></script>



    <main class="product-detail-layout">

        <section class="product-gallery retro-container">
            <div class="carousel">
                <button class="carousel-btn carousel-prev" aria-label="Imagen anterior">&#8592;</button>
                <img id="main-image" src="" alt="Product image">
                <button class="carousel-btn carousel-next" aria-label="Imagen siguiente">&#8594;</button>
            </div>
            <div id="thumbnails" class="thumbnails"></div>
        </section>

        <section class="product-info retro-container">
            <span id="product-status" class="product-card-status"></span>
            <h1 id="product-name"></h1>
            <p id="product-price" class="product-detail-price"></p>

            <table class="product-meta">
                <tr>
                    <td>Marca</td>
                    <td id="product-brand">—</td>
                </tr>
                <tr>
                    <td>Año</td>
                    <td id="product-year">—</td>
                </tr>
                <tr>
                    <td>Dimensiones</td>
                    <td id="product-dimensions">—</td>
                </tr>
                <tr>
                    <td>Categoría</td>
                    <td id="product-category">—</td>
                </tr>
                <tr>
                    <td>Publicado</td>
                    <td id="product-published">—</td>
                </tr>
            </table>

            <p id="product-description" class="product-description"></p>

            <div class="product-actions">
                <button 
                    id="btn-favourite" 
                    class="retro-button"
                    aria-label="Add to favourites">
                    ♡ Añadir a Favoritos
                </button>
                <button 
                    id="btn-buy" 
                    class="retro-button"
                    style="background: #90ee90; font-weight: bold;"
                    aria-label="Comprar este producto">
                    🛒 COMPRAR AHORA
                </button>
                <button 
                    id="btn-chat" 
                    class="retro-button"
                    aria-label="Ask the seller">
                    ✉ Preguntar al Vendedor
                </button>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <script type="module" src="../js/pages/producto.js"></script>
</body>
</html>
