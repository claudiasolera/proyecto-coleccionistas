<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NUEVA CONTRASEÑA - El Bazar</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
    </header>

    <main style="flex:1; display:flex; align-items:center; justify-content:center;">
        <div class="retro-container" style="max-width:400px; width:100%;">
            <div style="background:var(--clr-primary); color:#fff; padding:5px 10px; margin:-1.5rem -1.5rem 1.5rem -1.5rem; font-weight:bold;">
                RESET_PASSWORD.EXE
            </div>

            <label>Nueva contraseña:</label>
            <input type="password" id="password" class="retro-input" required minlength="6">

            <label style="margin-top:1rem;">Confirmar contraseña:</label>
            <input type="password" id="confirm" class="retro-input" required>

            <button id="btn-reset" class="retro-button" style="width:100%; margin-top:1rem;">
                GUARDAR CONTRASEÑA
            </button>

            <p id="error-msg" style="color:red; font-size:0.8rem; margin-top:1rem; display:none;"></p>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
    </footer>

    <script type="module">
        import { apiFetch } from './src/js/utils.js'

        const token = new URLSearchParams(window.location.search).get('token')
        const errorMsg = document.getElementById('error-msg')

        if (!token) window.location.href = '/login.html'

        document.getElementById('btn-reset').addEventListener('click', async () => {
            const password = document.getElementById('password').value
            const confirm = document.getElementById('confirm').value

            if (password !== confirm) {
                errorMsg.style.display = 'block'
                errorMsg.innerText = 'Las contraseñas no coinciden.'
                return
            }

            try {
                await apiFetch('/users/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ token, password })
                })
                alert('Contraseña actualizada correctamente.')
                window.location.href = '/login.html'
            } catch (err) {
                errorMsg.style.display = 'block'
                errorMsg.innerText = err.message
            }
        })
    </script>
</body>
</html>
