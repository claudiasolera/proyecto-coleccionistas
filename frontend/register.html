<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO - El Bazar</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
        </nav>
    </header>

    <script type="module" src="src/js/header.js"></script>

    <main style="max-width:500px; margin:2rem auto; padding:0 1rem;">
        <div class="retro-container">
            <div class="retro-titlebar">
                <span>NUEVO_USUARIO.EXE</span>
                <div class="retro-titlebar-buttons">
                    <button class="win-button" style="padding-bottom:4px;">_</button>
                    <button class="win-button">口</button>
                    <button class="win-button" style="font-weight:bold;">X</button>
                </div>
            </div>

            <h2 style="font-size: 1.1rem; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1.5rem; font-family: var(--font-accent);">CREAR CUENTA</h2>

            <form id="register-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                    <div>
                        <label>Nombre:</label>
                        <input type="text" name="name" class="retro-input" required>
                    </div>
                    <div>
                        <label>Apellidos:</label>
                        <input type="text" name="last_name" class="retro-input" required>
                    </div>
                </div>

                <label>E-mail:</label>
                <input type="email" name="email" class="retro-input" required>

                <label>Contraseña:</label>
                <input type="password" name="password" class="retro-input" required minlength="6">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                    <div>
                        <label>DNI:</label>
                        <input type="text" name="dni" class="retro-input" required>
                    </div>
                    <div>
                        <label>Teléfono:</label>
                        <input type="tel" name="phone" class="retro-input" required>
                    </div>
                </div>

                <label>Dirección de Envío:</label>
                <input type="text" name="address" class="retro-input" required>

                <p id="register-error" style="color:red; font-size:0.8rem; margin-top:0.5rem; display:none; font-family:var(--font-accent);"></p>

                <button type="submit" class="retro-button" style="width: 100%; margin-top: 1.5rem;">
                    FINALIZAR REGISTRO
                </button>

                <p style="text-align:center; margin-top:1rem; font-family:var(--font-accent); font-size:0.85rem;">
                    ¿Ya tienes cuenta? <a href="/login.html" style="color:var(--clr-primary);">ENTRAR</a>
                </p>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <script type="module">
        import { apiFetch, validators } from './src/js/utils.js';

        const form = document.getElementById('register-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());

            if (!validators.email(data.email)) {
                const err = document.getElementById('register-error')
                err.style.display = 'block'
                err.innerText = 'Email no válido.'
                return
            }
            if (!validators.phone(data.phone)) {
                const err = document.getElementById('register-error')
                err.style.display = 'block'
                err.innerText = 'El teléfono debe tener 9 dígitos.'
                return
            }

            try {
                await apiFetch('/users/register', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                form.innerHTML = `
                    <div style="text-align:center; padding:2rem;">
                        <p style="font-family:var(--font-accent); font-size:1.1rem; color:var(--clr-success); margin-bottom:1rem;">
                            [OK] REGISTRO COMPLETADO
                        </p>
                        <p style="font-family:var(--font-accent); font-size:0.85rem; color:#555; margin-bottom:1.5rem;">
                            Hemos enviado un email de verificación a <strong>${data.email}</strong>.<br>
                            Verifica tu cuenta antes de iniciar sesión.
                        </p>
                        <a href="/login.html" class="retro-button" style="display:inline-block;">
                            IR AL LOGIN
                        </a>
                    </div>
                `
            } catch (err) {
                const errorEl = document.getElementById('register-error')
                errorEl.style.display = 'block'
                errorEl.innerText = 'Error: ' + err.message
            }
        });
    </script>
</body>
</html>
