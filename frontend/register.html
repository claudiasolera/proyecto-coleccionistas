<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>REGISTRO - El Bazar</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
        </nav>
    </header>

    <script type="module" src="src/js/header.js"></script>

    <main style="max-width: 500px; margin: 2rem auto; padding: 1rem;">
        <div class="retro-container">
            <div style="background: var(--clr-primary); color: #fff; padding: 5px 10px; margin: -1.5rem -1.5rem 1.5rem -1.5rem; font-weight: bold; font-family: var(--font-accent);">
                NUEVO_USUARIO.EXE
            </div>

            <h2 style="font-size: 1.1rem; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1.5rem; font-family: var(--font-accent);">CREAR CUENTA</h2>

            <form id="register-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                    <div>
                        <label>Nombre:</label>
                        <input type="text" name="name" class="retro-input" required>
                    </div>
                    <div>
                        <label>Apellidos:</label>
                        <input type="text" name="last_name" class="retro-input" required>
                    </div>
                </div>

                <label>E-mail:</label>
                <input type="email" name="email" class="retro-input" required>

                <label>Contraseña:</label>
                <input type="password" name="password" class="retro-input" required minlength="6">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                    <div>
                        <label>DNI:</label>
                        <input type="text" name="dni" class="retro-input" required>
                    </div>
                    <div>
                        <label>Teléfono:</label>
                        <input type="tel" name="phone" class="retro-input" required>
                    </div>
                </div>

                <label>Dirección de Envío:</label>
                <input type="text" name="address" class="retro-input" required>

                <button type="submit" class="retro-button" style="width: 100%; margin-top: 1.5rem;">
                    FINALIZAR REGISTRO
                </button>

                <p style="text-align:center; margin-top:1rem; font-family:var(--font-accent); font-size:0.85rem;">
                    ¿Ya tienes cuenta? <a href="/login.html" style="color:var(--clr-primary);">ENTRAR</a>
                </p>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Terminal: COLEC_SYS_V2.0.1 | Conectado vía RT-Modem</p>
    </footer>

    <script type="module">
        import { apiFetch, validators } from './src/js/utils.js';

        const form = document.getElementById('register-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());

            if (!validators.email(data.email)) return alert('Email no válido');
            if (!validators.phone(data.phone)) return alert('Teléfono debe tener 9 dígitos');

            try {
                const user = await apiFetch('/users/register', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                localStorage.setItem('userId', user.id);
                localStorage.setItem('userName', user.name);
                localStorage.setItem('userRole', user.role || 'user');

                window.location.href = 'index.html';
            } catch (err) {
                alert('Error al registrar: ' + err.message);
            }
        });
    </script>
</body>
</html>
