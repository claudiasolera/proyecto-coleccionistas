<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RECUPERAR CONTRASEÑA - El Bazar</title>
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <header class="site-header">
        <h1 class="site-title">Tienda de Coleccionistas</h1>
        <nav class="site-nav">
            <a href="/index.html">Catálogo</a>
        </nav>
    </header>

    <main style="flex:1; display:flex; align-items:center; justify-content:center;">
        <div class="retro-container" style="max-width:400px; width:100%;">
            <div class="retro-titlebar">
                <span>RECOVER_PASSWORD.EXE</span>
                <div class="retro-titlebar-buttons">
                    <button class="win-button" style="padding-bottom:4px;">_</button>
                    <button class="win-button">口</button>
                    <button class="win-button" style="font-weight:bold;">X</button>
                </div>
            </div>

            <p style="font-family:var(--font-accent); font-size:0.85rem; margin-bottom:1rem;">
                Introduce tu e-mail y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <div id="form-section">
                <label>E-mail:</label>
                <input type="email" id="email" class="retro-input" required placeholder="ejemplo@correo.com">

                <button id="btn-send" class="retro-button" style="width:100%; margin-top:1rem;">
                    ENVIAR ENLACE
                </button>
            </div>

            <div id="success-section" style="display:none; text-align:center;">
                <p style="font-family:var(--font-accent); color:var(--clr-success); margin-bottom:1rem;">
                    [OK] Enlace enviado. Revisa tu bandeja de entrada.
                </p>
                <a href="/login.html" class="retro-button" style="display:inline-block;">
                    VOLVER AL LOGIN
                </a>
            </div>

            <p id="error-msg" style="color:red; font-size:0.8rem; margin-top:1rem; display:none;"></p>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 EL BAZAR DEL COLECCIONISTA - BUSCANDO TESOROS DESDE 1990</p>
    </footer>

    <script type="module">
        import { apiFetch } from './src/js/utils.js'

        document.getElementById('btn-send').addEventListener('click', async () => {
            const email = document.getElementById('email').value
            const errorMsg = document.getElementById('error-msg')

            if (!email) {
                errorMsg.style.display = 'block'
                errorMsg.innerText = 'Introduce tu e-mail.'
                return
            }

            try {
                await apiFetch('/users/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                })
                document.getElementById('form-section').style.display = 'none'
                document.getElementById('success-section').style.display = 'block'
            } catch (err) {
                errorMsg.style.display = 'block'
                errorMsg.innerText = err.message
            }
        })
    </script>
</body>
</html>
